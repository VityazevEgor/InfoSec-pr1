name: SAST Security Check

on:
  push:
    branches: [ main, develop, test-failure ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sast-scan:
    name: SAST Scanning
    runs-on: ubuntu-latest
    
    container:
      image: semgrep/semgrep:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: SAST Scan (All Rules)
        id: scan
        run: |
          semgrep scan --config auto --json --error app/ > sast_results.json
        continue-on-error: true
      
      - name: Parse and Show Results
        if: always()
        run: |
          if [ -f sast_results.json ]; then
            echo "Результаты сканирования:"
            echo "Количество уязвимостей: $(jq '.results | length' sast_results.json)"
            echo "Найдены следующие уязвимости:"
            jq -r '.results[] | "[DEFECT] \(.check_id) [\(.extra.severity)] at \(.path):\(.start.line)"' sast_results.json
          else
            echo "Уязвимостей не найдено"
          fi
      
      - name: Upload Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: sast_results.json
      
      - name: Create GitHub Issue on Critical Findings
        if: steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/create_issue.py
      
      - name: Check for Critical Issues
        if: steps.scan.outcome == 'failure'
        run: |
          echo "[FAIL] Критические уязвимости найдены!"
          exit 1
